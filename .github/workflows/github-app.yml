name: GitHub app

# The app under apps/github. A pull request typechecks, tests and builds it,
# and checks that the committed manifest and listing are current. A push to
# main or a `github-app-v*` tag also builds the image and pushes it to ghcr;
# the digest printed at the end is what the registry listing pins.

on:
  pull_request:
    paths:
      - "apps/github/**"
      - "registry/sources/morelitea/XTEAP993JW1E94/**"
      - ".github/workflows/github-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/github/**"
      - ".github/workflows/github-app.yml"
    tags: ["github-app-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/github

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/github/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The manifest validates with the kit, and manifest.json and the app's
      # registry source are what their sources produce.
      - run: npm run manifest:check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/morelitea/initiative-github
          tags: |
            type=match,pattern=github-app-v(.*),group=1
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/github
          push: ${{ github.event_name == 'push' }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print the digest
        if: github.event_name == 'push'
        working-directory: .
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/morelitea/initiative-github@${DIGEST}"
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/morelitea/initiative-github@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
