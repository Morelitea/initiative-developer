[project]
name = "initiative-registry"
version = "0.1.0"
description = "Builds and signs the TUF repository of Initiative apps and content."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "tuf>=6.0",
    "securesystemslib[crypto]>=1.3",
    "cryptography>=44",
    "jsonschema>=4.23",
]

[project.scripts]
initiative-registry = "initiative_registry.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["initiative_registry"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "initiative_registry/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
